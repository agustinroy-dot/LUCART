{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h3>Quotes</h3>
    <a href="{{ url_for('quotes.new_quote') }}"><button>New Quote</button></a>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for q in quotes %}
        <tr>
            <td>Q-{{ q.id }}</td>
            <td>{{ q.date.strftime('%Y-%m-%d') }}</td>
            <td>{{ q.customer.name }}</td>
            <td>${{ q.total }}</td>
            <td>{{ q.status }}</td>
            <td>
                <a href="{{ url_for('quotes.view_quote', id=q.id) }}"><button>View</button></a>
                {% if q.status == 'Accepted' %}
                <a href="{{ url_for('quotes.convert_to_order', id=q.id) }}" onclick="return confirm('Convert to Order?');"><button>Convert</button></a>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
