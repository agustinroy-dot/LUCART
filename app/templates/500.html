{% extends "base.html" %}

{% block content %}
<div class="window" style="max-width: 400px; margin: 50px auto; border-color: red;">
    <div class="title-bar" style="background: darkred;">
        <div class="title-bar-text">Critical Error 500</div>
    </div>

    </div>
</div>
{% endblock %}
