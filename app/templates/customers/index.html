{% extends "base.html" %}
{% block content %}
<div class="header">
    <h1 class="page-title">Customers</h1>
    <div class="actions">
        <a href="{{ url_for('customers.new_customer') }}" class="btn btn-primary">+ New Customer</a>
    </div>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for customer in customers %}
            <tr>
                <td>{{ customer.name }}</td>
                <td>{{ customer.email }}</td>
                <td>{{ customer.phone }}</td>
                <td>{{ customer.address }}</td>
                <td>
                    <a href="{{ url_for('customers.edit_customer', id=customer.id) }}" class="btn btn-sm btn-secondary">Edit</a>
                    <a href="{{ url_for('quotes.new_quote', customer_id=customer.id) }}" class="btn btn-sm btn-primary">New Quote</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
