{% extends "base.html" %}
{% block content %}
<div class="header">
    <h1 class="page-title">Inventory</h1>
    <div class="actions">
        <a href="{{ url_for('inventory.new_material') }}" class="btn btn-primary">+ Add Item</a>
    </div>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Quantity</th>
                <th>Cost/Unit</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in materials %}
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.type }}</td>
                <td style="{{ 'color:var(--error-color);font-weight:bold;' if item.quantity <= item.min_stock else '' }}">
                    {{ item.quantity }} {{ item.unit }}
                </td>
                <td>${{ item.cost }}</td>
                <td>
                    <a href="{{ url_for('inventory.edit_material', id=item.id) }}" class="btn btn-sm btn-secondary">Edit</a>
                    <a href="{{ url_for('inventory.update_stock', id=item.id) }}" class="btn btn-sm btn-secondary">Update Stock</a>
                    <a href="{{ url_for('inventory.history', id=item.id) }}" class="btn btn-sm btn-secondary">History</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
