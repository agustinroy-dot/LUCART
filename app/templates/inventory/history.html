{% extends "base.html" %}

{% block content %}
<h3>History for: {{ material.name }}</h3>
<a href="{{ url_for('inventory.index') }}"><button>Back to Inventory</button></a>

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Change</th>
            <th>Reason</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.date.strftime('%Y-%m-%d %H:%M') }}</td>
            <td style="color: {{ 'green' if log.type == 'in' else 'red' }}; font-weight: bold;">
                {{ log.type|upper }}
            </td>
            <td>{{ log.change_amount }} {{ material.unit }}</td>
            <td>{{ log.reason }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
